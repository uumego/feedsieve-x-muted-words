name: Apply menu hotfix

on:
  push:
    paths:
      - .github/workflows/apply-menu-hotfix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch userscripts
        shell: python
        run: |
          from pathlib import Path

          files = [
              (Path('feedsieve-x-muted-zh.user.js'), 'zh'),
              (Path('feedsieve-x-muted-en.user.js'), 'en'),
          ]

          old_matches = '''// @match        https://x.com/settings/muted_keywords*
          // @match        https://x.com/settings/add_muted_keyword*'''
          new_matches = '''// @match        https://x.com/*
          // @match        https://www.x.com/*
          // @match        https://twitter.com/*
          // @match        https://www.twitter.com/*'''

          old_tail = "panel();setInterval(panel,1500);setInterval(draw,1000);window.FSX={version:V,active,scan,start,pause,manager,setIntervalSeconds:seti,builtin:()=>[...W]};if(gs('auto',false))setTimeout(start,1800);"

          for path, lang in files:
              s = path.read_text(encoding='utf-8')
              s = s.replace('// @version      4.1.0', '// @version      4.1.1', 1)
              s = s.replace(old_matches, new_matches, 1)
              if '// @grant        GM_registerMenuCommand' not in s:
                  s = s.replace('// @grant        GM_deleteValue\n', '// @grant        GM_deleteValue\n// @grant        GM_registerMenuCommand\n', 1)
              s = s.replace("const V='4.1.0'", "const V='4.1.1'", 1)

              if lang == 'zh':
                  new_tail = """function istarget(){return /\\/settings\\/(?:muted_keywords|add_muted_keyword)/.test(location.pathname)}
          function mount(){if(istarget())panel();else document.getElementById(P+'-panel')?.remove()}
          GM_registerMenuCommand('打开 X 已隐藏字词页面',()=>{location.href='https://x.com/settings/muted_keywords'});
          GM_registerMenuCommand('显示 / 恢复控制面板',()=>{if(istarget())panel();else location.href='https://x.com/settings/muted_keywords'});
          GM_registerMenuCommand('暂停自动添加',pause);
          mount();setInterval(mount,1000);setInterval(()=>{if(istarget())draw()},1000);window.FSX={version:V,active,scan,start,pause,manager,panel,setIntervalSeconds:seti,builtin:()=>[...W]};if(istarget()&&gs('auto',false))setTimeout(start,1800);"""
              else:
                  new_tail = """function istarget(){return /\\/settings\\/(?:muted_keywords|add_muted_keyword)/.test(location.pathname)}
          function mount(){if(istarget())panel();else document.getElementById(P+'-panel')?.remove()}
          GM_registerMenuCommand('Open X muted words page',()=>{location.href='https://x.com/settings/muted_keywords'});
          GM_registerMenuCommand('Show / restore control panel',()=>{if(istarget())panel();else location.href='https://x.com/settings/muted_keywords'});
          GM_registerMenuCommand('Pause auto import',pause);
          mount();setInterval(mount,1000);setInterval(()=>{if(istarget())draw()},1000);window.FSX={version:V,active,scan,start,pause,manager,panel,setIntervalSeconds:seti,builtin:()=>[...W]};if(istarget()&&gs('auto',false))setTimeout(start,1800);"""

              if old_tail not in s:
                  raise SystemExit(f'Expected init tail not found in {path}')
              s = s.replace(old_tail, new_tail, 1)
              path.write_text(s, encoding='utf-8')

      - name: Validate JavaScript
        run: |
          node --check feedsieve-x-muted-zh.user.js
          node --check feedsieve-x-muted-en.user.js

      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feedsieve-x-muted-zh.user.js feedsieve-x-muted-en.user.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix Tampermonkey menu and X domain matching"
            git push
          fi
