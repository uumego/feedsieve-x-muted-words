name: Hotfix v4.1.2

on:
  push:
    paths:
      - .github/workflows/hotfix-v412.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Chinese userscript
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('feedsieve-x-muted-zh.user.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('// @version      4.1.1','// @version      4.1.2',1)
          s=s.replace('// @grant        GM_registerMenuCommand\n','// @grant        GM_registerMenuCommand\n// @grant        GM.registerMenuCommand\n',1)
          s=s.replace('// @run-at       document-idle','// @run-at       document-start',1)
          s=s.replace("const V='4.1.1'","const V='4.1.2'",1)
          # Remove older late registrations so the menu is registered only once.
          for old in [
              "GM_registerMenuCommand('打开 X 已隐藏字词页面',()=>location.href='https://x.com/settings/muted_keywords');\n",
              "GM_registerMenuCommand('显示 / 恢复控制面板',()=>target()?panel():location.href='https://x.com/settings/muted_keywords');GM_registerMenuCommand('暂停自动添加',pause);GM_registerMenuCommand('管理关键词',()=>target()?manager():location.href='https://x.com/settings/muted_keywords');\n",
              "GM_registerMenuCommand('打开 X 已隐藏字词页面',()=>{location.href='https://x.com/settings/muted_keywords'});\n",
              "GM_registerMenuCommand('显示 / 恢复控制面板',()=>{if(istarget())panel();else location.href='https://x.com/settings/muted_keywords'});\n",
              "GM_registerMenuCommand('暂停自动添加',pause);\n",
          ]:
              s=s.replace(old,'')
          needle="(async()=>{'use strict';\n"
          early="""function regMenu(name,fn){try{if(typeof GM_registerMenuCommand==='function')return GM_registerMenuCommand(name,fn);if(typeof GM!=='undefined'&&typeof GM.registerMenuCommand==='function')return GM.registerMenuCommand(name,fn)}catch(e){console.warn('[FSX] menu registration failed',e)}}\nfunction goMuted(){location.href='https://x.com/settings/muted_keywords'}\nregMenu('FSX：打开 X 已隐藏字词页面',goMuted);\nregMenu('FSX：显示 / 恢复控制面板',()=>target()?panel():goMuted());\nregMenu('FSX：暂停自动添加',()=>pause());\nregMenu('FSX：管理关键词',()=>target()?manager():goMuted());\nfunction launcher(){if(!document.body||document.getElementById('fsxz-launcher'))return;let b=document.createElement('button');b.id='fsxz-launcher';b.textContent='FSX';b.title='FeedSieve → X 关键词管理';b.style='position:fixed;right:18px;bottom:18px;z-index:2147483647;background:#1d9bf0;color:#fff;border:0;border-radius:999px;width:48px;height:48px;font:bold 13px Arial;box-shadow:0 4px 18px #0006;cursor:pointer';b.onclick=()=>target()?panel():goMuted();document.body.appendChild(b)}\nsetInterval(launcher,700);\n"""
          if 'fsxz-launcher' not in s:
              s=s.replace(needle,needle+early,1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check feedsieve-x-muted-zh.user.js
      - name: Commit hotfix
        run: |
          git config user.name "uumego"
          git config user.email "206110a@gmail.com"
          git add feedsieve-x-muted-zh.user.js
          git diff --cached --quiet || git commit -m "Fix Chinese userscript menu and launcher"
          git push
