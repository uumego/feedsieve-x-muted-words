name: Hotfix v4.1.3 launcher

on:
  push:
    paths:
      - .github/workflows/hotfix-v413.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Insert early Tampermonkey menus and visible launcher
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('feedsieve-x-muted-zh.user.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('// @version      4.1.2','// @version      4.1.3',1)
          s=s.replace("const V='4.1.2'","const V='4.1.3'",1)
          # Remove late/duplicate menu registrations from previous builds.
          s='\n'.join(line for line in s.split('\n') if 'GM_registerMenuCommand(' not in line)
          block="""function regMenu(name,fn){try{if(typeof GM_registerMenuCommand==='function')return GM_registerMenuCommand(name,fn);if(typeof GM!=='undefined'&&typeof GM.registerMenuCommand==='function')return GM.registerMenuCommand(name,fn)}catch(e){console.warn('[FSX] menu registration failed',e)}}
function goMuted(){location.href='https://x.com/settings/muted_keywords'}
regMenu('FSX：打开 X 已隐藏字词页面',goMuted);
regMenu('FSX：显示 / 恢复控制面板',()=>target()?panel():goMuted());
regMenu('FSX：暂停自动添加',()=>pause());
regMenu('FSX：管理关键词',()=>target()?manager():goMuted());
function launcher(){if(!document.body||document.getElementById('fsxz-launcher'))return;let b=document.createElement('button');b.id='fsxz-launcher';b.textContent='FSX';b.title='FeedSieve → X 关键词管理';b.style='position:fixed;right:18px;bottom:18px;z-index:2147483647;background:#1d9bf0;color:#fff;border:0;border-radius:999px;width:48px;height:48px;font:bold 13px Arial;box-shadow:0 4px 18px #0006;cursor:pointer';b.onclick=()=>target()?panel():goMuted();document.body.appendChild(b)}
document.addEventListener('DOMContentLoaded',launcher,{once:true});
setInterval(launcher,700);
"""
          marker="(()=>{'use strict';\n"
          if marker not in s:
              marker="(async()=>{'use strict';\n"
          if marker not in s:
              raise SystemExit('IIFE marker not found')
          s=s.replace(marker,marker+block,1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check feedsieve-x-muted-zh.user.js
          grep -q 'fsxz-launcher' feedsieve-x-muted-zh.user.js
          grep -q 'FSX：打开 X 已隐藏字词页面' feedsieve-x-muted-zh.user.js
      - name: Commit hotfix
        run: |
          git config user.name "uumego"
          git config user.email "206110a@gmail.com"
          git add feedsieve-x-muted-zh.user.js
          git diff --cached --quiet || git commit -m "Add early menu registration and FSX launcher"
          git push
